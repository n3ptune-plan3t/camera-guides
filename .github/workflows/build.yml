name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.14.4"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v7
        with:
          name: camera-guides-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Calculate next tag and create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch --tags --force
          LATEST_TAG=$(git tag -l --sort=-v:refname | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)
          if [ -z "$LATEST_TAG" ]; then
            NEXT_TAG="0.0.1"
          else
            CLEAN_TAG="${LATEST_TAG#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CLEAN_TAG"
            NEXT_TAG="${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi
          echo "Releasing version: $NEXT_TAG"
          APK_PATH=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
          NAMED_APK="camera-guides-${NEXT_TAG}.apk"
          cp "$APK_PATH" "$NAMED_APK"
          gh release create "$NEXT_TAG" "$NAMED_APK" \
            --title "Camera Guides ${NEXT_TAG}" \
            --generate-notes
